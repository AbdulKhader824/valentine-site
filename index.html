<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Valentine ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  text-align: center;
  color: white;
}

.container {
  padding: 20px;
}

h1 {
  font-size: 26px;
  animation: fadeIn 2s ease-in-out;
}

button {
  padding: 12px 25px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  margin: 10px;
  cursor: pointer;
  transition: 0.3s;
}

#yesBtn {
  background: #ff2e63;
  color: white;
}

#noBtn {
  background: #444;
  color: white;
  position: absolute;
}

#loveMessage {
  display: none;
  font-size: 22px;
  margin-top: 20px;
  animation: fadeIn 1.5s ease-in-out;
}

/* Floating hearts */
.heart {
  position: absolute;
  font-size: 20px;
  animation: floatUp 4s linear infinite;
}

@keyframes floatUp {
  from {
    transform: translateY(0);
    opacity: 1;
  }
  to {
    transform: translateY(-600px);
    opacity: 0;
  }
}

/* Photo Bubbles */
.photoBubble {
  position: absolute;
  border-radius: 50%;
  background-size: cover;
  background-position: center;
  animation: floatBubble 7s linear infinite;
  box-shadow: 0 0 15px rgba(255,255,255,0.7);
}

@keyframes floatBubble {
  from {
    transform: translateY(0);
    opacity: 1;
  }
  to {
    transform: translateY(-800px);
    opacity: 0;
  }
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<div class="container">
  <h1>Will you be my Valentine? 😍</h1>
  <button id="yesBtn">Yes 💖</button>
  <button id="noBtn">No 😏</button>

  <div id="loveMessage">
    😍 I knew it!!!<br>
    You are officially stuck with me forever aachi kutty 😎❤️<br>
    Happy Valentine's Day 💕
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const message = document.getElementById("loveMessage");

/* Move No button randomly */
function moveButton() {
  const maxX = window.innerWidth - 100;
  const maxY = window.innerHeight - 60;
  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top = Math.random() * maxY + "px";
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("click", moveButton);

/* YES Button */
yesBtn.addEventListener("click", () => {
  message.style.display = "block";
  createHearts();
  createPhotoBubbles();
});

/* Hearts */
function createHearts() {
  for (let i = 0; i < 30; i++) {
    const heart = document.createElement("div");
    heart.innerHTML = "❤️";
    heart.classList.add("heart");
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.bottom = "0px";
    heart.style.fontSize = Math.random() * 20 + 20 + "px";
    heart.style.animationDuration = Math.random() * 3 + 2 + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);
  }
}

/* AUTO PHOTO LOOP */
function createPhotoBubbles() {

  const totalPhotos = 12; // 👈 change this to how many photos you have

  for (let i = 0; i < 50; i++) {

    const bubble = document.createElement("div");
    bubble.classList.add("photoBubble");

    const randomNumber = Math.floor(Math.random() * totalPhotos) + 1;

    // For names like: photo (1).jpeg
    bubble.style.backgroundImage = `url("photo (${randomNumber}).jpeg")`;

    bubble.style.left = Math.random() * window.innerWidth + "px";
    bubble.style.bottom = "0px";

    const size = Math.random() * 50 + 60;
    bubble.style.width = size + "px";
    bubble.style.height = size + "px";

    bubble.style.animationDuration = Math.random() * 4 + 4 + "s";

    document.body.appendChild(bubble);

    setTimeout(() => bubble.remove(), 7000);
  }
}

</script>

</body>
</html>
